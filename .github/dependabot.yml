version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine minor/patch bumps; majors arrive individually.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # `astro check` refuses TypeScript 7 (its language server needs <7).
      # Revisit when @astrojs/check supports it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
